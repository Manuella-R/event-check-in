groups:
  - name: checkin
    rules:
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(checkin_request_seconds_bucket{endpoint="scan"}[30s]))) > 0.5
        for: 30s
        labels: { severity: warning }
        annotations: { summary: "p95 scan latency above 500 ms" }
      - alert: HighErrorRate
        expr: sum(rate(checkin_requests_total{status=~"5.."}[30s])) / sum(rate(checkin_requests_total[30s])) > 0.01
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "More than 1% of requests are failing" }
      - alert: ReplicaDown
        expr: up{job="checkin"} == 0
        for: 15s
        labels: { severity: critical }
        annotations: { summary: "An app replica is not responding to scrapes" }
