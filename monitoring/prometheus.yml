global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: checkin
    # Scrape EVERY replica directly (not through nginx): the DNS name "app"
    # returns all replica IPs, so new replicas are discovered automatically.
    dns_sd_configs:
      - names: ["app"]
        type: A
        port: 8000
        refresh_interval: 5s
